name: Java обновляет README

on:
  push:
    branches: [main]
    paths-ignore:
      - README.md
      - INCIDENTS.md
      - assets/diagnostics.svg
      - assets/java-share.svg
      - tools/state/**
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - name: Получить файлы репозитория
        uses: actions/checkout@v7

      - name: Установить Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Скомпилировать весь Java-проект
        run: |
          mkdir -p tools/.build
          javac -encoding UTF-8 -d tools/.build tools/*.java tools/tests/*.java

      - name: Проверить JSON с шутками
        run: java -Dfile.encoding=UTF-8 -cp tools/.build JokeValidator

      - name: Выполнить тесты генератора шуток
        run: java -Dfile.encoding=UTF-8 -cp tools/.build JokeValidatorTest

      - name: Обновить README и отчёты
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: java -Dfile.encoding=UTF-8 -cp tools/.build ReadmeGenerator

      - name: Сохранить результаты генерации
        run: |
          git add -A -- README.md INCIDENTS.md assets/diagnostics.svg tools/state/
          if [ -f assets/java-share.svg ]; then
            git add -A -- assets/java-share.svg
          fi
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Обновить README и отчёты через Java"
            git push
          fi
